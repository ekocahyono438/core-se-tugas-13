<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 javascript</title>
    //ini bagian css
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.0;

        }
        button{
            padding: 10px 10px;
            cursor: pointer;
        }
        #tips{
            margin-top: 10px;
            padding: 15;
            background-color: #f0f5f1;
            border-left: #0f6a4a;
        }

    </style>
</head>
<body>
    <h1>Customer Registration Form</h1>
    <p>
        Latihan Mengugunakan javascript
    </p>
    <button id="toggleButton" type="button">
        Tampilkan Petunjuk
    </button>
    <div id="tips" hidden>
        <strong>Petunjuk Register</strong>
        <p>
            isi nama lengkap dan email dengan benar sebelum mengisi formulir
        </p>
    </div>

    <script>
        
    //ini bagian javascript
        console.log("javascript berhasil dimuat");
        const toggleButton =document.querySelector("#toggleButton");
        const tips = document.querySelector("#tips");

        toggleButton.addEventListener("click", function(){
            tips.hidden = !tips.hidden;
            console.log("tombol di klik");
        });
    </script>
</body>
</html>
